<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snipbox — code snippet library</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e7490'/%3E%3Cpath d='M13 10l-5 6 5 6M19 10l5 6-5 6' stroke='%23fff' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="top">
    <a class="brand" href="#/"><span class="logo" aria-hidden="true"></span>Snipbox</a>
    <div class="row grow"><a class="btn primary" href="#/new" id="new-snippet">+ New snippet</a></div>
    <div class="row"><a class="btn" href="/api/export" download id="export">Export</a>
      <label class="btn filebtn">Import<input type="file" id="import-file" accept="application/json,.json" hidden></label></div>
  </header>
  <main id="main" tabindex="-1"></main>
  <div id="toasts" role="status" aria-live="polite"></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
